spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9999
    consumer:
      group-id: test-group
  data:
    redis:
      host: localhost
      port: 9999
  mail:
    host: localhost
    port: 1025
    username: test
    password: test

security:
  jwt:
    secret: "super-secret-test-key-that-is-at-least-32-bytes-long"
    expiration-ms: 3600000

app:
  features:
    search-enabled: true
chat:
  default-page-limit: 10