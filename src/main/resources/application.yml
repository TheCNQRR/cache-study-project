security:
  jwt:
    secret: "my-telegram-clone-study-proj-secret-key"
    expiration-ms: 3600000

spring:
  application:
    name: CacheApplication
  datasource:
    url: jdbc:postgresql://localhost:5432/telegram_clone
    username: postgres
    password: postgres
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-group
      consumer:
        auto-offset-reset: earliest
        key-deserializer: StringDeserializer
        value-deserializer: JsonDeserializer
        properties:
          spring:
            json:
              trusted:
                packages: "by/java/enterprise/*"
      producer:
        key-serializer: StringSerializer
        value-serializer: JsonSerializer

app:
  features:
    search-enabled: true

chat:
  default-page-limit: 10

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

---
spring:
  config:
    activate:
      on-profile: prod

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: dev

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
